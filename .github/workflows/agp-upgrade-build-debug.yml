name: AGP Upgrade Build Debug

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'chore/agp-upgrade/**'

jobs:
  build-debug:
    name: Build debug (single combo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Update version catalog for debug combo
        run: |
          python - <<'PY'
          import re
          fn='gradle/libs.versions.toml'
          s=open(fn).read()
          s=re.sub(r'(?m)^(agp\s*=\s*)"[^"]*"', r'\1"9.3.0-alpha09"', s)
          s=re.sub(r'(?m)^(kotlin\s*=\s*)"[^"]*"', r'\1"2.3.0"', s)
          open(fn,'w').write(s)
          print('Updated',fn)
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Gradle assembleDebug and save log
        run: |
          ./gradlew --no-daemon clean assembleDebug --stacktrace 2>&1 | tee build.log || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: agp-build-log
          path: build.log
