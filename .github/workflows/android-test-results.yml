name: Android Unit Tests
on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  unit-tests:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci run]')) ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.title, '[ci run]') || contains(github.event.pull_request.body, '[ci run]')))
    name: Run unit tests and upload results
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install Android SDK (for Gradle Android plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --rerun-tasks --console=plain
      - name: Upload test-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: app/build/test-results
      - name: Upload test-reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: app/build/reports/tests