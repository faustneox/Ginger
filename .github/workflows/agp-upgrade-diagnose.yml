name: AGP Upgrade Diagnose

on:
  push:
    branches:
      - 'chore/agp-upgrade/**'
  pull_request:
    branches:
      - 'chore/agp-upgrade/**'

jobs:
  diagnose:
    name: Upload diagnostic artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create diagnostic file
        run: |
          echo "AGP upgrade diagnostic" > diagnostic.txt
          echo "branch=$GITHUB_REF" >> diagnostic.txt
          echo "commit=$GITHUB_SHA" >> diagnostic.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: agp-diagnostic
          path: diagnostic.txt
